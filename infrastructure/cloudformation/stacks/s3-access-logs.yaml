AWSTemplateFormatVersion: '2010-09-09'
Description: 'Centralized S3 Access Logs Bucket for RAG Document Storage'

Parameters:
  Environment:
    Type: String
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Deployment environment

Resources:
  AccessLogsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'rag-docs-access-logs-${Environment}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            BucketKeyEnabled: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireAccessLogs
            Status: Enabled
            ExpirationInDays: 90
            Transitions:
              - TransitionInDays: 30
                StorageClass: STANDARD_IA
      Tags:
        - Key: Name
          Value: !Sub 'rag-docs-access-logs-${Environment}'
        - Key: environment
          Value: !Ref Environment
        - Key: project
          Value: rag
        - Key: purpose
          Value: access-logs
        - Key: managed_by
          Value: cloudformation

  # Bucket policy to allow other S3 buckets to write access logs
  AccessLogsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AccessLogsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: S3ServerAccessLogsPolicy
            Effect: Allow
            Principal:
              Service: logging.s3.amazonaws.com
            Action:
              - s3:PutObject
            Resource: !Sub '${AccessLogsBucket.Arn}/*'
            Condition:
              ArnLike:
                'aws:SourceArn': !Sub 'arn:aws:s3:::rag-docs-*-${Environment}'
          - Sid: EnforceSSLOnly
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt AccessLogsBucket.Arn
              - !Sub '${AccessLogsBucket.Arn}/*'
            Condition:
              Bool:
                'aws:SecureTransport': false

Outputs:
  AccessLogsBucketName:
    Description: Name of the access logs bucket
    Value: !Ref AccessLogsBucket
    Export:
      Name: !Sub 'rag-s3-access-logs-${Environment}-name'

  AccessLogsBucketArn:
    Description: ARN of the access logs bucket
    Value: !GetAtt AccessLogsBucket.Arn
    Export:
      Name: !Sub 'rag-s3-access-logs-${Environment}-arn'
