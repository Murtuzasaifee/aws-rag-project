AWSTemplateFormatVersion: '2010-09-09'
Description: 'S3 Bucket per Organization for RAG Document Storage'

Parameters:
  OrgId:
    Type: String
    Description: Organization identifier
    AllowedPattern: '^[a-z0-9-]+$'
    ConstraintDescription: Must be lowercase alphanumeric with hyphens only

  Environment:
    Type: String
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Deployment environment

  KmsKeyArn:
    Type: String
    Description: ARN of the KMS key for SSE-KMS encryption

  AccessLogsBucketName:
    Type: String
    Description: Name of the S3 access logs bucket

  SqsQueueArn:
    Type: String
    Description: ARN of the SQS queue for S3 event notifications

  ApiRoleArn:
    Type: String
    Description: ARN of the FastAPI backend IAM role

  ProcessorRoleArn:
    Type: String
    Description: ARN of the processing service IAM role

  FrontendOrigin:
    Type: String
    Description: CORS origin for pre-signed URL uploads
    Default: '*'

Resources:
  OrgBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'rag-docs-${OrgId}-${Environment}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !Ref KmsKeyArn
            BucketKeyEnabled: true
      LoggingConfiguration:
        LogFilePrefix: !Sub '${OrgId}/'
        DestinationBucketName: !Ref AccessLogsBucketName
      LifecycleConfiguration:
        Rules:
          # raw/ prefix: Transition to IA after 30 days, expire after 365 days
          - Id: RawToIA
            Status: Enabled
            Prefix: raw/
            Transitions:
              - TransitionInDays: 30
                StorageClass: STANDARD_IA
            ExpirationInDays: 365
          # processed/ prefix: Transition to IA after 60 days, expire after 730 days
          - Id: ProcessedToIA
            Status: Enabled
            Prefix: processed/
            Transitions:
              - TransitionInDays: 60
                StorageClass: STANDARD_IA
            ExpirationInDays: 730
          # failed/ prefix: Delete after 30 days
          - Id: FailedExpiry
            Status: Enabled
            Prefix: failed/
            ExpirationInDays: 30
          # quarantine/ prefix: Delete after 7 days
          - Id: QuarantineExpiry
            Status: Enabled
            Prefix: quarantine/
            ExpirationInDays: 7
          # Noncurrent versions: Keep 3 versions, delete after 90 days
          - Id: NoncurrentVersions
            Status: Enabled
            NoncurrentVersionTransitions:
              - TransitionInDays: 30
                StorageClass: STANDARD_IA
            NoncurrentVersionExpirationInDays: 90
            NewerNoncurrentVersions: 3
      NotificationConfiguration:
        QueueConfigurations:
          # S3 event notifications for each file extension
          - Event: s3:ObjectCreated:*
            Queue: !Ref SqsQueueArn
            Filter:
              KeyFilterRules:
                - Name: prefix
                  Value: raw/
                - Name: suffix
                  Value: .pdf
          - Event: s3:ObjectCreated:*
            Queue: !Ref SqsQueueArn
            Filter:
              KeyFilterRules:
                - Name: prefix
                  Value: raw/
                - Name: suffix
                  Value: .docx
          - Event: s3:ObjectCreated:*
            Queue: !Ref SqsQueueArn
            Filter:
              KeyFilterRules:
                - Name: prefix
                  Value: raw/
                - Name: suffix
                  Value: .txt
          - Event: s3:ObjectCreated:*
            Queue: !Ref SqsQueueArn
            Filter:
              KeyFilterRules:
                - Name: prefix
                  Value: raw/
                - Name: suffix
                  Value: .png
          - Event: s3:ObjectCreated:*
            Queue: !Ref SqsQueueArn
            Filter:
              KeyFilterRules:
                - Name: prefix
                  Value: raw/
                - Name: suffix
                  Value: .jpg
          - Event: s3:ObjectCreated:*
            Queue: !Ref SqsQueueArn
            Filter:
              KeyFilterRules:
                - Name: prefix
                  Value: raw/
                - Name: suffix
                  Value: .jpeg
          - Event: s3:ObjectCreated:*
            Queue: !Ref SqsQueueArn
            Filter:
              KeyFilterRules:
                - Name: prefix
                  Value: raw/
                - Name: suffix
                  Value: .tiff
      CorsConfiguration:
        CorsRules:
          - AllowedMethods:
              - PUT
              - POST
            AllowedOrigins:
              - !Ref FrontendOrigin
            AllowedHeaders:
              - '*'
            MaxAge: 3000
      Tags:
        - Key: Name
          Value: !Sub 'rag-docs-${OrgId}-${Environment}'
        - Key: org_id
          Value: !Ref OrgId
        - Key: environment
          Value: !Ref Environment
        - Key: project
          Value: rag
        - Key: managed_by
          Value: cloudformation

  OrgBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref OrgBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # Deny all actions over insecure transport
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt OrgBucket.Arn
              - !Sub '${OrgBucket.Arn}/*'
            Condition:
              Bool:
                'aws:SecureTransport': false

          # Deny unencrypted PUT objects
          - Sid: DenyUnencryptedPut
            Effect: Deny
            Principal: '*'
            Action: 's3:PutObject'
            Resource: !Sub '${OrgBucket.Arn}/*'
            Condition:
              StringNotEquals:
                's3:x-amz-server-side-encryption': 'aws:kms'

          # Deny PUT objects without KMS key
          - Sid: DenyNonKmsEncryption
            Effect: Deny
            Principal: '*'
            Action: 's3:PutObject'
            Resource: !Sub '${OrgBucket.Arn}/*'
            Condition:
              StringNotEquals:
                's3:x-amz-server-side-encryption-aws-kms-key-id': !Ref KmsKeyArn

          # Allow FastAPI backend role
          - Sid: AllowFastAPIBackend
            Effect: Allow
            Principal:
              AWS: !Ref ApiRoleArn
            Action:
              - s3:PutObject
              - s3:GetObject
              - s3:DeleteObject
              - s3:ListBucket
            Resource:
              - !GetAtt OrgBucket.Arn
              - !Sub '${OrgBucket.Arn}/*'

          # Allow processing service role
          - Sid: AllowProcessingService
            Effect: Allow
            Principal:
              AWS: !Ref ProcessorRoleArn
            Action:
              - s3:GetObject
              - s3:PutObject
              - s3:DeleteObject
              - s3:ListBucket
            Resource:
              - !GetAtt OrgBucket.Arn
              - !Sub '${OrgBucket.Arn}/*'

Outputs:
  BucketName:
    Description: Name of the S3 bucket
    Value: !Ref OrgBucket
    Export:
      Name: !Sub 'rag-s3-${OrgId}-${Environment}-name'

  BucketArn:
    Description: ARN of the S3 bucket
    Value: !GetAtt OrgBucket.Arn
    Export:
      Name: !Sub 'rag-s3-${OrgId}-${Environment}-arn'
