[project]
name = "rag-app"
version = "0.1.0"
description = "Production-ready AWS-native Retrieval-Augmented Generation (RAG) application."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Vraj Patel", email = "vraj04.patel@gmail.com" }
]
keywords = ["aws", "rag", "retrieval-augmented generation", "python"]

dependencies = [
    "black>=26.1.0",
    "boto3>=1.42.59",
    "botocore>=1.42.59",
    "fastapi>=0.135.0",
    "flake8>=7.3.0",
    "httpx>=0.28.1",
    "moto[dynamodb,s3,stepfunctions]>=5.1.21",
    "mypy>=1.19.1",
    "opensearch-py>=3.1.0",
    "pre-commit>=4.5.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.22",
    "redis>=7.2.1",
    "uvicorn[standard]>=0.41.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragapp"]

